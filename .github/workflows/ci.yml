name: AI-CAS CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ai-cas-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Governance contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run offline governance checks
        shell: bash
        run: bash scripts/ci-contract.sh

      - name: Run application checks
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
