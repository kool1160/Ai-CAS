name: AI-CAS CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ai-cas-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Governance contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare base branch comparison
        shell: bash
        run: git branch main origin/main

      - name: Run offline governance checks
        shell: bash
        run: bash scripts/ci-contract.sh

  application:
    name: Application baseline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run application tests
        shell: bash
        run: npm run test:run

      - name: Run TypeScript checks
        shell: bash
        run: npm run typecheck

      - name: Build application
        shell: bash
        run: npm run build

      - name: Run privacy fixture check
        shell: bash
        run: node scripts/privacy-fixture-check.mjs
